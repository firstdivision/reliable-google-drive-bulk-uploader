name: Publish Phase 0 harness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check harness
        run: |
          node --check phase0/baseline.js
          node --check phase0/experiments.js
          node --check phase1/app.mjs
          node --check phase1/google.mjs
          node --check phase1/drive-upload.mjs
          node --test tests/*.test.cjs
          node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p public/phase1
          cp phase0/* public/
          cp phase1/* public/phase1/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
